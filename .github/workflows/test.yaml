name: "Test pipeline"

on:
  workflow_dispatch:
    inputs:
      view:
        description: "View name"
        required: true
        type: string
      description:
        description: "Short description"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  delivery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Print inputs
        run: |
          echo "ClearCase view: ${{ inputs.view }}"
          echo "Description:: ${{ inputs.description }}"

      - name: Generate random result
        id: random
        run: |
          if (( RANDOM % 2 )); then
            result=true
          else
            result=false
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "Random result: $result"

      - name: Generate HTML report
        id: report
        env:
          VIEW: ${{ inputs.view }}
          DESCRIPTION: ${{ inputs.description }}
          RESULT: ${{ steps.random.outputs.result }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          TEMPLATE: .github/templates/report.html
        run: |
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g' <<< "$1"; }

          export TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export VIEW_ESC=$(esc "$VIEW")
          export DESCRIPTION_ESC=$(esc "$DESCRIPTION")
          export ACTOR_ESC=$(esc "$ACTOR")

          if [ "$RESULT" = "true" ]; then
            export STATUS_LABEL=PASSED STATUS_CLASS=ok
          else
            export STATUS_LABEL=FAILED STATUS_CLASS=fail
          fi

          file="run-${RUN_NUMBER}.html"
          mkdir -p reports
          envsubst < "$TEMPLATE" > "reports/$file"

          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Generated reports/$file from $TEMPLATE"

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy report to gh-pages
        env:
          FILE: ${{ steps.report.outputs.file }}
        run: |
          mkdir -p gh-pages/reports
          cp "reports/$FILE" "gh-pages/reports/$FILE"

      - name: Add row to index.html and publish
        env:
          FILE: ${{ steps.report.outputs.file }}
          TIMESTAMP: ${{ steps.report.outputs.timestamp }}
          RUN_NUMBER: ${{ github.run_number }}
          VIEW: ${{ inputs.view }}
          DESCRIPTION: ${{ inputs.description }}
          RESULT: ${{ steps.random.outputs.result }}
        working-directory: gh-pages
        run: |
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g' <<< "$1"; }

          if [ "$RESULT" = "true" ]; then
            status='<span class="ok">PASSED</span>'
          else
            status='<span class="fail">FAILED</span>'
          fi

          row="<tr><td><a href=\"reports/${FILE}\">#${RUN_NUMBER}</a></td><td>${TIMESTAMP}</td><td>$(esc "$VIEW")</td><td>$(esc "$DESCRIPTION")</td><td>${status}</td></tr>"

          if ! grep -q '<!-- REPORTS -->' index.html; then
            echo "::error::Marker <!-- REPORTS --> not found in index.html"
            exit 1
          fi

          # insert the new row right after the marker (newest first)
          awk -v row="$row" '{ print } /<!-- REPORTS -->/ { print "    " row }' index.html > index.html.tmp
          mv index.html.tmp index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/"$FILE" index.html
          git commit -m "Add report for run #${RUN_NUMBER}"
          git push
