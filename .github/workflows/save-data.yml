name: Save json
on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  save-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download data.json
        uses: actions/download-artifact@v4
        with:
          name: data
          path: data # restores data/data.json

      - name: Copy data to gh-pages and publish
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p gh-pages/data
          cp data/data.json gh-pages/data/data.json

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet && { echo "data.json unchanged"; exit 0; }
          git commit -m "Update data.json for run #${RUN_NUMBER}"
          git push
