name: Generate Report
on:
  workflow_call:
    inputs:
      result:
        type: string
        required: false
        default: "success"

permissions:
  contents: write

jobs:
  save-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download data.json
        uses: actions/download-artifact@v4
        with:
          name: data
          path: data # restores data/data.json

      - name: Copy data to gh-pages and publish
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p gh-pages/data
          cp data/data.json gh-pages/data/data.json

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet && { echo "data.json unchanged"; exit 0; }
          git commit -m "Update data.json for run #${RUN_NUMBER}"
          git push

  generate-report:
    runs-on: ubuntu-latest
    needs: save-data

    steps:
      - name: Checkout repo (template)
        uses: actions/checkout@v7

      - name: Download data.json
        uses: actions/download-artifact@v4
        with:
          name: data
          path: data # restores data/data.json

      - name: Generate HTML report
        id: report
        env:
          WORK_RESULT: ${{ inputs.result }}
          DATA: data/data.json
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          TEMPLATE: .github/templates/report.html
        run: |
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g' <<< "$1"; }

          VIEW=$(jq -r '.inputs.view // ""' "$DATA")
          DESCRIPTION=$(jq -r '.inputs.description // ""' "$DATA")
          UPDATE=$(jq -r '.work.update // ""' "$DATA")

          if [ "$WORK_RESULT" = "success" ]; then
            RESULT=true
            export STATUS_LABEL=PASSED STATUS_CLASS=ok
          else
            RESULT=false
            export STATUS_LABEL=FAILED STATUS_CLASS=fail
          fi

          export RESULT RUN_NUMBER RUN_ID RUN_URL
          export TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export VIEW_ESC=$(esc "$VIEW")
          export DESCRIPTION_ESC=$(esc "$DESCRIPTION")
          export UPDATE_ESC=$(esc "$UPDATE")
          export ACTOR_ESC=$(esc "$ACTOR")

          file="run-${RUN_NUMBER}.html"
          mkdir -p reports
          envsubst < "$TEMPLATE" > "reports/$file"

          {
            echo "file=$file"
            echo "timestamp=$TIMESTAMP"
            echo "view=$VIEW"
            echo "description=$DESCRIPTION"
            echo "update=$UPDATE"
            echo "result=$RESULT"
          } >> "$GITHUB_OUTPUT"
          echo "Generated reports/$file from $TEMPLATE"

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy report to gh-pages
        env:
          FILE: ${{ steps.report.outputs.file }}
        run: |
          mkdir -p gh-pages/reports
          cp "reports/$FILE" "gh-pages/reports/$FILE"

      - name: Add row to index.html and publish
        working-directory: gh-pages
        env:
          FILE: ${{ steps.report.outputs.file }}
          TIMESTAMP: ${{ steps.report.outputs.timestamp }}
          VIEW: ${{ steps.report.outputs.view }}
          DESCRIPTION: ${{ steps.report.outputs.description }}
          UPDATE: ${{ steps.report.outputs.update }}
          RESULT: ${{ steps.report.outputs.result }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g' <<< "$1"; }

          if [ "$RESULT" = "true" ]; then
            status='<span class="ok">PASSED</span>'
          else
            status='<span class="fail">FAILED</span>'
          fi

          row="<tr><td><a href=\"reports/${FILE}\">#${RUN_NUMBER}</a></td><td>${TIMESTAMP}</td><td>$(esc "$VIEW")</td><td>$(esc "$DESCRIPTION")</td><td>$(esc "$UPDATE")</td><td>${status}</td></tr>"

          if ! grep -q '<!-- REPORTS -->' index.html; then
            echo "::error::Marker <!-- REPORTS --> not found in index.html"
            exit 1
          fi

          # insert the new row right after the marker (newest first)
          awk -v row="$row" '{ print } /<!-- REPORTS -->/ { print "      " row }' index.html > index.html.tmp
          mv index.html.tmp index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/"$FILE" index.html
          git commit -m "Add report for run #${RUN_NUMBER}"
          git push
