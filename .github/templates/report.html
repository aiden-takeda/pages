<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run #${RUN_NUMBER} report</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border: 1px solid #ccc; padding: .5rem; text-align: left; }
    .ok { color: #1a7f37; font-weight: bold; }
    .fail { color: #cf222e; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Run #${RUN_NUMBER}</h1>
  <p class="${STATUS_CLASS}">${STATUS_LABEL}</p>
  <table>
    <tr><th>View</th><td>${VIEW_ESC}</td></tr>
    <tr><th>Description</th><td>${DESCRIPTION_ESC}</td></tr>
    <tr><th>Result</th><td>${RESULT}</td></tr>
    <tr><th>Triggered by</th><td>${ACTOR_ESC}</td></tr>
    <tr><th>Date (UTC)</th><td>${TIMESTAMP}</td></tr>
    <tr><th>Workflow run</th><td><a href="${RUN_URL}">${RUN_ID}</a></td></tr>
  </table>
  <p><a href="../index.html">Back to all reports</a></p>
</body>
</html>
